services:
  app:
    build: .
    image: my-app
    ports:
      - "8089:8089"
    depends_on:
      - redis
    environment:
      - SPRING_REDIS_HOST=redis

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  redis-insight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    depends_on:
      - redis

  # ===== JENKINS =====
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    user: root
    ports:
      - "8082:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /Users/nguyendoandong/project:/workspace

  # ===== PROMETHEUS =====
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - app

  # ===== GRAFANA =====
  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  jenkins_home:
  grafana-storage: