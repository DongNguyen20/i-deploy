version: '3.8'

services:
  app:
    build: .
    image: my-app
    ports:
      - "8080:8080"
    depends_on:
      - redis
    environment:
      - SPRING_REDIS_HOST=redis

  redis:
    image: redis:7
    ports:
      - "6379:6379"
  redis-insight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    depends_on:
      - redis

