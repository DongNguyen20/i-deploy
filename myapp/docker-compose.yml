version: '3.8'

services:
  app:
    build: .
    image: my-app
    ports:
      - "8080:8080"
    depends_on:
      - redis
    environment:
      - SPRING_REDIS_HOST=redis

  redis:
    image: redis:7
    ports:
      - "6379:6379"
  redis-insight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    depends_on:
      - redis

#    Option small
#  redis-commander:
#    image: rediscommander/redis-commander
#    ports:
#      - "8082:8081"
#    environment:
#      - REDIS_HOSTS=local:redis:6379

#====== JENKINS ========
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    user: root
    ports:
      - "8082:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /Users/nguyendoandong/project:/workspace

volumes:
  jenkins_home: